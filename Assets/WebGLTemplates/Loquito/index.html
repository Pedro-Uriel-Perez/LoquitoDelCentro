<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <style>
      /* El juego llena todo el espacio disponible conservando 16:9 (franjas negras si sobra) */
      html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
      #unity-canvas { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #000; outline: none; }
      #carga { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
               gap: 24px; background: #120f1c; }
      #carga img { width: min(420px, 60vw); height: auto; }
      #barra { width: min(320px, 50vw); height: 10px; border: 2px solid #59698f; border-radius: 6px; background: #1d1a2c; }
      #barra-llena { width: 0; height: 100%; border-radius: 4px; background: #dc5280; transition: width 0.2s; }
      #aviso { position: absolute; left: 0; right: 0; top: 0; text-align: center; font: 14px sans-serif; color: #000; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="carga">
      <img src="TemplateData/logo.png" alt="{{{ PRODUCT_NAME }}}">
      <div id="barra"><div id="barra-llena"></div></div>
    </div>
    <div id="aviso"></div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Tamaño 16:9 lo más grande posible dentro de la ventana (en pares, para la Pixel Perfect Camera)
      function ajustar() {
        var w = window.innerWidth, h = window.innerHeight;
        if (w / h > 16 / 9) w = h * 16 / 9; else h = w * 9 / 16;
        canvas.style.width = (Math.floor(w / 2) * 2) + "px";
        canvas.style.height = (Math.floor(h / 2) * 2) + "px";
      }
      window.addEventListener("resize", ajustar);
      ajustar();

      // Al hacer clic el juego recibe el teclado (itch lo muestra dentro de un iframe)
      canvas.addEventListener("pointerdown", function () { canvas.focus(); });

      function mostrarAviso(msg, type) {
        var aviso = document.querySelector("#aviso");
        var div = document.createElement("div");
        div.innerHTML = msg;
        div.style = "padding: 8px; background: " + (type == "error" ? "#f55" : "#fd5") + ";";
        aviso.appendChild(div);
        if (type != "error") setTimeout(function () { aviso.removeChild(div); }, 5000);
      }

      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: mostrarAviso,
      };

      var script = document.createElement("script");
      script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#barra-llena").style.width = (100 * progress) + "%";
        }).then(function () {
          document.querySelector("#carga").style.display = "none";
          canvas.focus();
        }).catch(function (message) {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
